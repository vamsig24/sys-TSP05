<text x="50" y="642" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">Vo -&gt; A1,  Vcc -&gt; 5V,  GND -&gt; GND</text>
<text x="50" y="659" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">10 uF across Vcc/GND recommended</text>
