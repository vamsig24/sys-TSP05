<text x="50" y="566" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">5V -- flex -- A0 -- 10k -- GND</text>
<rect x="40" y="600" width="260" height="74" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/>
<rect x="40" y="600" width="260" height="24" rx="8" fill="#2e7d32"/>
<rect x="40" y="614" width="260" height="10" fill="#2e7d32"/>
