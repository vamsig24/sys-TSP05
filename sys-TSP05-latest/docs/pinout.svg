<text x="810" y="278" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">D2 &lt;- button &lt;- 5V</text>
<text x="810" y="295" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">D2 -- 10k pull-down -- GND</text>
