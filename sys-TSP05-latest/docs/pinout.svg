<text x="810" y="218" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">A -&gt; D3 (interrupt),  B -&gt; D4</text>
<rect x="800" y="236" width="260" height="70" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="2.5"/>
<rect x="800" y="236" width="260" height="24" rx="8" fill="#fb8c00"/>
<rect x="800" y="250" width="260" height="10" fill="#fb8c00"/>
