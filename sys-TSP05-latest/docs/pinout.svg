<text x="50" y="199" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start">Stepper driver (EasyDriver)</text>
<text x="50" y="224" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">DIR   &lt;- D13</text>
<text x="50" y="241" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">STEP  &lt;- D12</text>
<text x="50" y="258" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">GND -&gt; GND, motor power separate</text>
