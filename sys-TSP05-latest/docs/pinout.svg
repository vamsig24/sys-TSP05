<rect x="800" y="650" width="260" height="10" fill="#546e7a"/>
<text x="810" y="653" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start">Notes</text>
<text x="810" y="678" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">All grounds common (Arduino, servo,</text>
<text x="810" y="695" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">driver and sensor supplies).</text>
<text x="810" y="712" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">Free: D5, D9, D11, A3</text>
<text x="810" y="729" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">(D9/D10 PWM off: Servo uses Timer1)</text>
