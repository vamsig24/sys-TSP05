<text x="810" y="578" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">SCL -&gt; A5,   SDA -&gt; A4</text>
<text x="810" y="595" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">VIN -&gt; supply per breakout (5V/3.3V)</text>
<text x="810" y="612" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">GND -&gt; GND</text>
