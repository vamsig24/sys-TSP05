<text x="50" y="129" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">V+  -&gt; EXTERNAL regulated 5-6V</text>
<text x="50" y="146" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">GND -&gt; shared GND with Arduino</text>
