<text x="50" y="728" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">wiper -&gt; A2,  ends -&gt; 5V and GND</text>
<rect x="800" y="536" width="260" height="84" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2.5"/>
