<text x="810" y="112" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">IN1 &lt;- D8,  IN2 &lt;- D7,  ENA &lt;- D6 (PWM)</text>
<text x="810" y="129" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">motor power from its own supply,</text>
<text x="810" y="146" font-size="12" fill="#212121" font-weight="normal" text-anchor="start">GND common with the Arduino</text>
